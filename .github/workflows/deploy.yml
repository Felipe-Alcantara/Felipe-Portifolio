name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # ou 'master', dependendo do nome da sua branch principal
  workflow_dispatch:

permissions:
  contents: write # necessário para commitar os dados sincronizados de volta
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sincroniza READMEs e metadados dos repositórios direto da API do GitHub
      # antes do build, garantindo que o site publicado reflita o conteúdo atual.
      # O token só é usado para autenticação/limites; a sincronização aceita
      # exclusivamente repositórios públicos.
      - name: Sync GitHub repositories
        run: node scripts/sync-github-repos.mjs
        env:
          GITHUB_USERNAME: felipe-alcantara
          GITHUB_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}

      # Commita os dados sincronizados de volta na main para que o repositório
      # local e a produção não divirjam. Usa [skip ci] para não disparar um novo
      # deploy em loop. Repositórios novos entram ocultos (curadoria opt-in).
      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-import
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos dados sincronizados."
          else
            git commit -m "chore(data): sincroniza repositórios do GitHub [skip ci]"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
